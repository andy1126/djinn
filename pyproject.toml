[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "djinn"
version = "0.1.0"
description = "Djinn — multi-market (A-share / HK / US) quantitative backtesting framework"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Djinn Contributors" }]
keywords = ["backtest", "quant", "trading", "finance", "a-share", "stock"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "yfinance>=0.2.40",
    "exchange_calendars>=4.5",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "joblib>=1.4",
    "pynescript>=0.3.0",
    "click>=8.1", # typer runtime
]

[project.optional-dependencies]
akshare = ["akshare>=1.12"]
tushare = ["tushare>=1.4"]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "black==25.12.0",
    "ruff==0.14.13",
    "mypy==1.19.1",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
djinn = "djinn.cli.app:app"

[project.urls]
Homepage = "https://github.com/djinn/djinn"

[tool.hatch.build.targets.wheel]
packages = ["src/djinn"]

# ── Black ──────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py313"]

# ── Ruff ───────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",   # line length handled by black
    "B008",   # typer/click 在默认参数里调用 Option 是惯用法
    "RUF009", # dataclass 用 D(0) 等作默认是本框架 Decimal 惯用法
    "RUF022", # __all__ 排序非必需
    "RUF002", # 中文注释里的全角字符
    "RUF003", # 中文注释全角字符
    "SIM102", # nested if 合并有时降低可读性
    "SIM103", # 条件直接返回有时降低可读性
    "SIM108", # 三元 vs if-else 按可读性取舍
    "C408",   # plotly 的 dict(...) 调用是惯用法
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "S101", "RUF059", "SIM102", "SIM103", "SIM108", "PLR2004"]
"examples/**" = ["T201"]

[tool.ruff.format]
quote-style = "double"

# ── MyPy ───────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "akshare.*",
    "tushare.*",
    "exchange_calendars.*",
    "yfinance.*",
    "scipy.*",
    "plotly.*",
    "seaborn.*",
    "joblib.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pynescript.*"]
follow_imports = "skip"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ── Pytest ─────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: pytest-benchmark perf tests",
    "network: tests requiring network access",
]
filterwarnings = [
    "error::DeprecationWarning:djinn.*",
]

[tool.coverage.run]
source = ["src/djinn"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
